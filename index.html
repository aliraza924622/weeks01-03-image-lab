<!DOCTYPE html>
<html>
<head>
<title>My Photo Editing</title>
<style>
body {
  text-align: center;
  font-family: Arial;
  background: #f2f2f2;
}
h1 {
  color: #333;
}
.box {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}
.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 0 10px #ccc;
}
img {
  width: 300px;
  border-radius: 10px;
}
</style>
</head>
<body>

<h1>My Photo Editing Project</h1>
<p>Original vs Edited Photo</p>

<div class="box">
  <div class="card">
    <h2>Original</h2>
    <img src="images/original.jpg">
  </div>

  <div class="card">
    <h2>Edited</h2>
    <img src="images/edited.jpg">
  </div>
</div>

</body>
</html>
